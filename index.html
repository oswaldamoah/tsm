<div id="costs-tab" class="tab-content">
                    <h3 class="tab-title">Cost Management</h3>
                    <div class="card">
                        <div class="card-content">
                            <div class="form-group">
                                <label for="labor-cost-input">Labor Cost (₵)</label>
                                <input type="number" id="labor-cost-input" class="input" min="0" step="0.01" value="0">
                            </div>

                            <button id="update-costs-btn" class="btn btn-primary">Update Labor Cost</button>
                        </div>
                    </div>

                    <h3 class="tab-title mt-4">Cost Summary</h3>
                    <div class="card">
                        <div class="card-content">
                            <div class="cost-summary">
                                <div class="cost-row">
                                    <span class="cost-label">Materials Cost:</span>
                                    <span id="summary-material-cost" class="cost-value">₵0.00</span>
                                </div>
                                <div class="cost-row">
                                    <span class="cost-label">Labor Cost:</span>
                                    <span id="summary-labor-cost" class="cost-value">₵0.00</span>
                                </div>
                                <div class="cost-row border-bottom">
                                    <span class="cost-label">Operational Costs Total:</span>
                                    <span id="summary-operational-cost" class="cost-value">₵0.00</span>
                                </div>
                                <div class="cost-row total">
                                    <span class="cost-label">Total Cost:</span>
                                    <span id="summary-total-cost" class="cost-value">₵0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
